name: Align current Medi-Matrix evidence copy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align copy with the current captured UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project-medi-matrix.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '아래 RED 화면은 서비스의 의사결정 지원 UX를 보여주는 실제 데모 캡처입니다.': '아래 화면은 현재 Production 샘플 Case에서 캡처한 실제 Triage 상태입니다.',
            'Medi-Matrix 데모에서 RED triage 상태가 표시된 실제 화면': 'Medi-Matrix Production 샘플 Case의 현재 Triage 상태가 표시된 실제 화면',
            '04 / AI RISK CONTEXT → EXPLICIT RED TRIAGE STATE': '04 / AI RISK CONTEXT → CURRENT TRIAGE STATE',
            'RED Triage에서 Golden-Time 병원 탐색으로 이어집니다.': '현재 Triage에서 Golden-Time 병원 후보 탐색으로 이어집니다.',
            'CODE RED 상태에서 필요한 자원 조건을 확인하고 Golden-Time으로 넘어가는 실제 데모 화면을 복원했습니다.': '현재 Production Triage 상태에서 필요한 자원 조건을 확인하고 Golden-Time 탐색으로 이어지는 실제 화면입니다.',
            'Medi-Matrix CODE RED 상태에서 Golden-Time 병원 탐색으로 연결하는 실제 데모 화면': 'Medi-Matrix 현재 Triage 상태에서 Golden-Time 병원 후보 탐색으로 연결하는 실제 Production 화면',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/fix-medi-current-copy.yml

      - name: Commit corrected evidence copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-medi-matrix.html
          git commit -m "fix: align Medi-Matrix copy with current production capture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
