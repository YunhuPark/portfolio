name: Finalize current Medi-Matrix captures

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bust screenshot cache and remove temporary workflow
        run: |
          sed -i 's/medi-viewer-3d.png?v=3/medi-viewer-3d.png?v=4/g' project-medi-matrix.html
          sed -i 's/medi-vitals-upload.png?v=3/medi-vitals-upload.png?v=4/g' project-medi-matrix.html
          sed -i 's/medi-monitoring.png?v=3/medi-monitoring.png?v=4/g' project-medi-matrix.html
          sed -i 's/medi-red-triage.png?v=3/medi-red-triage.png?v=4/g' project-medi-matrix.html
          sed -i 's/medi-code-red-handoff.png?v=3/medi-code-red-handoff.png?v=4/g' project-medi-matrix.html
          git rm .github/workflows/capture-current-medi-production.yml

      - name: Commit final capture wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-medi-matrix.html
          git commit -m "chore: wire current Medi-Matrix production captures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
