name: Refine Medi-Matrix case density

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply scoped Medi-Matrix density pass
        run: |
          python3 <<'PY'
          from pathlib import Path

          html_path = Path('project-medi-matrix.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<body class="case-body">', '<body class="case-body medi-case-body">', 1)
          html = html.replace('assets/refinements.css?v=12', 'assets/refinements.css?v=13', 1)
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('assets/refinements.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Medi-Matrix recruiter-density pass — 2026-09-11 */'
          if marker not in css:
              css += r'''

          /* Medi-Matrix recruiter-density pass — 2026-09-11 */
          .medi-case-body .case-section h2 { max-width: 820px; }
          .medi-case-body .case-section h3 { margin: 22px 0 8px; font-size: 18px; line-height: 1.35; }
          .medi-case-body .case-shot { margin-top: 20px; }
          .medi-case-body .case-shot img { max-height: 560px; margin-inline: auto; }
          .medi-case-body .case-shot.case-shot-hero img { max-height: 500px; }
          .medi-case-body .demo-flow-rail { margin-top: 18px; padding-block: 11px; }
          .medi-case-body .demo-evidence-grid { margin-top: 20px; gap: clamp(22px, 2.5vw, 34px); }
          .medi-case-body .demo-evidence-grid .case-shot:nth-child(2) { max-width: 320px; }
          .medi-case-body .demo-evidence-grid .case-shot:nth-child(2) img { max-height: 480px; }
          .medi-case-body .handoff-boundary { margin-top: 18px; }
          .medi-case-body .handoff-boundary > div { padding: 16px 18px; }
          .medi-case-body .case-note { margin-top: 14px; }
          .medi-case-body .case-visual .preview-stage { min-height: 230px; }
          .medi-case-body .case-visual .algo-log { margin-top: 24px; }

          @media (min-width: 821px) {
            .medi-case-body .case-content { width: min(100%, 1280px); margin-inline: auto; padding: 76px clamp(32px, 3vw, 48px) 92px; }
            .medi-case-body .case-lead,
            .medi-case-body .case-section { grid-template-columns: 140px minmax(0, 1fr); gap: clamp(28px, 3vw, 42px); }
            .medi-case-body .case-section { padding: 34px 0; }
            .medi-case-body .case-section h2 { margin-bottom: 14px; font-size: clamp(27px, 2.35vw, 34px); line-height: 1.2; }
            .medi-case-body .case-section p { max-width: 800px; margin-bottom: 12px; font-size: 15px; line-height: 1.72; }
            .medi-case-body .case-section li { padding-block: 11px; font-size: 14px; line-height: 1.6; }
            .medi-case-body .case-section li::before { top: 11px; }
          }

          @media (max-width: 820px) {
            .medi-case-body .case-content { padding-top: 64px; padding-bottom: 78px; }
            .medi-case-body .case-lead,
            .medi-case-body .case-section { gap: 14px; }
            .medi-case-body .case-section { padding: 30px 0; }
            .medi-case-body .case-section h2 { margin-bottom: 14px; font-size: clamp(24px, 7.6vw, 29px); line-height: 1.24; }
            .medi-case-body .case-section h3 { margin-top: 18px; font-size: 17px; }
            .medi-case-body .case-section p { margin-bottom: 12px; font-size: 15px; line-height: 1.7; }
            .medi-case-body .case-shot img { width: auto; max-width: 100%; max-height: 430px; margin-inline: auto; }
            .medi-case-body .case-shot.case-shot-hero img { max-height: 340px; }
            .medi-case-body .demo-evidence-grid { gap: 24px; }
            .medi-case-body .demo-evidence-grid .case-shot:nth-child(2) { max-width: none; }
            .medi-case-body .demo-evidence-grid .case-shot:nth-child(2) img { width: auto; max-height: 390px; margin-inline: auto; }
            .medi-case-body .case-section li { padding: 10px 0 10px 27px; font-size: 14px; line-height: 1.58; }
            .medi-case-body .case-section li::before { top: 10px; }
            .medi-case-body .handoff-boundary > div { padding: 14px 15px; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY

          git rm .github/workflows/refine-medi-density.yml

      - name: Commit density pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-medi-matrix.html assets/refinements.css
          git commit -m "refactor: tighten Medi-Matrix case-study density"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture refined page locally
        run: |
          mkdir -p medi-density-audit
          python3 -m http.server 4173 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const cfg of [
              { name: 'desktop', width: 1536, height: 960, mobile: false },
              { name: 'mobile', width: 390, height: 844, mobile: true },
            ]) {
              const context = await browser.newContext({ viewport: { width: cfg.width, height: cfg.height }, isMobile: cfg.mobile });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/project-medi-matrix.html', { waitUntil: 'networkidle' });
              await page.screenshot({ path: `medi-density-audit/medi-${cfg.name}-full.png`, fullPage: true });
              const metrics = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight,
                clientHeight: document.documentElement.clientHeight,
              }));
              fs.writeFileSync(`medi-density-audit/medi-${cfg.name}.json`, JSON.stringify(metrics, null, 2));
              await context.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: medi-density-audit
          path: medi-density-audit
          retention-days: 3
