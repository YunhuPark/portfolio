name: Production visual audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture production pages
        env:
          BASE_URL: https://park-yunhu-portfolio.vercel.app
        run: |
          mkdir -p visual-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const pages = [
            ['home', '/'],
            ['algo', '/project-algo'],
            ['medi', '/project-medi-matrix'],
            ['insight', '/project-medical-insight'],
            ['imst', '/project-imst-mamba'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newContext({ viewport: { width: 1536, height: 960 }, deviceScaleFactor: 1 });
            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true });

            async function capture(context, name, route, suffix, fullPage=true) {
              const page = await context.newPage();
              await page.emulateMedia({ reducedMotion: 'reduce' });
              const errors = [];
              page.on('pageerror', e => errors.push('pageerror: ' + e.message));
              page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
              const res = await page.goto(process.env.BASE_URL + route, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForTimeout(1800);
              const target = path.join('visual-audit', `${name}-${suffix}.png`);
              await page.screenshot({ path: target, fullPage });
              fs.writeFileSync(path.join('visual-audit', `${name}-${suffix}.txt`), [
                `url=${page.url()}`,
                `status=${res ? res.status() : 'null'}`,
                `title=${await page.title()}`,
                `scrollWidth=${await page.evaluate(() => document.documentElement.scrollWidth)}`,
                `clientWidth=${await page.evaluate(() => document.documentElement.clientWidth)}`,
                `scrollHeight=${await page.evaluate(() => document.documentElement.scrollHeight)}`,
                `clientHeight=${await page.evaluate(() => document.documentElement.clientHeight)}`,
                ...errors,
              ].join('\n') + '\n');
              await page.close();
            }

            for (const [name, route] of pages) {
              await capture(desktop, name, route, 'desktop-full', true);
            }
            await capture(desktop, 'home', '/', 'desktop-fold', false);
            await capture(desktop, 'medi', '/project-medi-matrix', 'desktop-fold', false);
            await capture(mobile, 'home', '/', 'mobile-full', true);
            await capture(mobile, 'medi', '/project-medi-matrix', 'mobile-full', true);

            await desktop.close();
            await mobile.close();
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit
          path: visual-audit
          retention-days: 3
