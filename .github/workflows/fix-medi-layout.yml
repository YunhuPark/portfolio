name: Fix Medi-Matrix case layout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Medi-Matrix layout refinements
        run: |
          cat >> assets/refinements.css <<'CSS'

          /* Medi-Matrix case-study balance pass — 2026-09-11 */
          .case-section li {
            position: relative;
            display: block;
            padding: 14px 0 14px 32px;
          }

          .case-section li::before {
            position: absolute;
            left: 0;
            top: 14px;
          }

          .case-section li code {
            white-space: nowrap;
            word-break: normal;
            overflow-wrap: normal;
          }

          .demo-evidence-grid {
            grid-template-columns: minmax(0, 1.4fr) minmax(240px, .6fr);
            gap: clamp(24px, 3vw, 40px);
            align-items: start;
          }

          .demo-evidence-grid .case-shot:nth-child(2) {
            width: 100%;
            max-width: 360px;
            justify-self: end;
          }

          .demo-evidence-grid .case-shot:nth-child(2) img {
            width: auto;
            max-width: 100%;
            max-height: 560px;
            margin-left: auto;
          }

          .live-evidence-section > div,
          .case-content:has(.demo-evidence-grid) .case-section > div {
            min-width: 0;
          }

          @media (min-width: 821px) {
            .case-content:has(.demo-evidence-grid) {
              width: min(100%, 1320px);
              margin-inline: auto;
              padding: 94px clamp(32px, 3.2vw, 52px) 116px;
            }

            .case-content:has(.demo-evidence-grid) .case-lead,
            .case-content:has(.demo-evidence-grid) .case-section {
              grid-template-columns: 150px minmax(0, 1fr);
              gap: clamp(32px, 3.4vw, 48px);
            }

            .case-content:has(.demo-evidence-grid) .case-section {
              padding: 46px 0;
            }

            .case-content:has(.demo-evidence-grid) .case-section h2 {
              max-width: 840px;
              font-size: clamp(28px, 2.6vw, 38px);
              line-height: 1.22;
            }

            .case-content:has(.demo-evidence-grid) .case-section p {
              max-width: 820px;
              font-size: 16px;
              line-height: 1.76;
            }

            .case-content:has(.demo-evidence-grid) .case-section li {
              font-size: 15px;
              line-height: 1.65;
            }
          }

          @media (max-width: 820px) {
            .demo-evidence-grid {
              grid-template-columns: 1fr;
              gap: 28px;
            }

            .demo-evidence-grid .case-shot:nth-child(2) {
              max-width: none;
              justify-self: stretch;
            }

            .demo-evidence-grid .case-shot:nth-child(2) img {
              width: 100%;
              max-height: none;
              margin-left: 0;
            }

            .case-section li {
              padding-left: 28px;
            }
          }
          CSS

          git rm .github/workflows/fix-medi-layout.yml

      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/refinements.css
          git commit -m "fix: rebalance Medi-Matrix case-study layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
